version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plex-wrapped-dev
    working_dir: /app
    volumes:
      # - .:/app
      # - /app/node_modules
      # - /app/.next
      - ./data:/data
    # Loopback only: rate limits trust X-Forwarded-For, so a client that
    # reaches the app port directly could choose its own address. Put the
    # reverse proxy in front, on this host or an internal network.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/plex_wrapped?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - db
      - redis
    stdin_open: true
    tty: true

  db:
    image: postgres:15-alpine
    container_name: plex-wrapped-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=plex_wrapped
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  db-playwright:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=plex_manager_test
    ports:
      - "5433:5432"
    volumes:
      - db-data-playwright:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: plex-wrapped-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  db-data-playwright:
  redis-data:

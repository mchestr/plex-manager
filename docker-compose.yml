# Development only. It builds from source and pins localhost URLs below; for a
# production install use deploy/docker-compose.yml (docs/deployment.md), which
# runs the published image with every setting from .env.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plex-wrapped-dev
    working_dir: /app
    # Loopback only: rate limits trust X-Forwarded-For, so a client that
    # reaches the app port directly could choose its own address. Put the
    # reverse proxy in front, on this host or an internal network.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/plex_wrapped?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXTAUTH_URL=http://localhost:3000
      # Server time zone until one is saved in Admin > Settings, which overrides it
      # - TZ=America/Chicago
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  # Postgres and Redis listen on loopback only (SEC-04): a port published on
  # every interface bypasses the host firewall, and P0.10 keeps the rate
  # limiter's state in this Redis. Both refuse to start without a password.
  db:
    image: postgres:16-alpine
    container_name: plex-wrapped-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=plex_wrapped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "plex_wrapped"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-playwright:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=plex_manager_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data-playwright:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "plex_manager_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: plex-wrapped-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    # redis-cli reads the password from REDISCLI_AUTH, so the health check
    # authenticates without putting it on the command line.
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  db-data-playwright:
  redis-data:

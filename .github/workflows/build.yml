# Not "Build" or "CI": workflow_run triggers on main matched those names and
# ran on pull-request code (SEC-02). Required checks key on the job names below.
name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  # Lets visual-baselines.yml start these checks on the commit it pushes when
  # no App token or PAT is configured (e2e/visual/README.md).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plex_manager_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/plex_manager_test?schema=public"

      - name: Run linter
        run: npm run lint

  # Design-debt ratchet (ui-design-system 9.6): fails when a count in
  # design-debt.json rises or a new file has a non-zero count. The full history
  # gives origin/main, which the script diffs against to carry renames over.
  design-system:
    name: Design System
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check design debt
        run: node scripts/check-design-system.mjs --check

  build:
    name: Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plex_manager_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/plex_manager_test?schema=public"

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/plex_manager_test?schema=public"

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/plex_manager_test?schema=public"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXTAUTH_SECRET: "test-secret-for-ci-build-at-least-32-chars-long"
          PLEX_CLIENT_IDENTIFIER: "00000000-0000-0000-0000-000000000000"

  # Smoke-builds the Docker image for pull requests without pushing it.
  # Images are published only by docker-publish.yml, from main and v* tags.
  docker-build:
    name: Docker Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/plex_manager_test?schema=public"

      # No database: lib/prisma.ts only needs DATABASE_URL set. The Postgres-
      # and Redis-backed suites (*.pg.test.ts, *.redis.test.ts) run in the
      # integration job; see jest.config.js.
      - name: Run unit tests with coverage
        run: npm run test:coverage -- --ci --reporters=default --reporters=github-actions
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/plex_manager_test?schema=public"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # The Postgres- and Redis-backed suites (*.pg.test.ts, *.redis.test.ts),
  # gated by describePg and describeRedis (test/helpers/integration.ts). Under
  # CI a missing TEST_DATABASE_URL or TEST_REDIS_URL fails them instead of
  # skipping them.
  integration:
    name: Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plex_manager_it_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/plex_manager_it_test?schema=public"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/plex_manager_it_test?schema=public"
      TEST_REDIS_URL: "redis://localhost:6379/0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      # The suites share one database and one Redis, so they run one at a time.
      - name: Run integration tests
        run: npm run test:integration -- --ci --reporters=default --reporters=github-actions

  # Fails when prisma/schema.prisma and the migrations disagree: a schema edit
  # without its migration, or a migration edited by hand. Exit code 2 is drift.
  schema-drift:
    name: Schema Drift
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plex_manager_drift_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/plex_manager_drift_test?schema=public"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply every migration to an empty database
        run: npx prisma migrate deploy

      # Prints the human-readable diff before failing.
      - name: Compare the migrated database with schema.prisma
        run: |
          set +e
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "::error::prisma/schema.prisma differs from the migrations. Create a migration with npm run db:migrate."
          fi
          exit "$status"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plex_manager_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # Without Redis, FR-50 shows Rewind's unavailable state (P5.1, P6.9).
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/plex_manager_test?schema=public"

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/plex_manager_test?schema=public"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/plex_manager_test?schema=public"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/plex_manager_test?schema=public"
          NEXT_PUBLIC_APP_URL: "http://localhost:3100"
          NEXTAUTH_URL: "http://localhost:3100"
          NEXTAUTH_SECRET: "test-secret-for-ci-build-at-least-32-chars-long"
          PLEX_CLIENT_IDENTIFIER: "00000000-0000-0000-0000-000000000000"
          NEXT_PUBLIC_ENABLE_TEST_AUTH: "true"
          E2E_TEST_MODE: "true"
          SKIP_CONNECTION_TESTS: "true"
          REDIS_URL: "redis://localhost:6379/0"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7


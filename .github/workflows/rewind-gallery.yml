# The headless gallery of the Rewind review fixtures (P7.11): every page at
# 390x844 and 1440x900 and every card, with a contact sheet, from the CI
# production build. Run it by hand from the Actions tab before the pre-freeze
# review (P7.16); the folder is uploaded as the rewind-gallery artifact.
name: Rewind Gallery

on:
  workflow_dispatch:
    inputs:
      copy:
        description: Copy for the dry runs (default is the selected model when there is one)
        required: true
        default: default
        type: choice
        options:
          - default
          - selected
          - templates

permissions:
  contents: read

jobs:
  gallery:
    name: Rewind gallery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Keep the tag equal to the exact @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plex_manager_e2e_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The dry runs are jobs on Redis (P7.10).
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/plex_manager_e2e_test?schema=public"
      E2E_DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/plex_manager_e2e_test?schema=public"
      REDIS_URL: "redis://redis:6379/0"
      NEXT_PUBLIC_APP_URL: "http://localhost:3100"
      NEXTAUTH_URL: "http://localhost:3100"
      PLEX_CLIENT_IDENTIFIER: "00000000-0000-0000-0000-000000000000"
      E2E_TEST_MODE: "true"
      SKIP_CONNECTION_TESTS: "true"
      # The server and the script resolve it against the checkout.
      REWIND_CACHE_DIR: rewind-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # A fresh secret per run; the script's admin session cookie is signed with it.
      - name: Generate NEXTAUTH_SECRET
        run: |
          secret="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64'))")"
          echo "::add-mask::$secret"
          echo "NEXTAUTH_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Run Prisma migrations
        run: npm run db:deploy

      # The E2E seed: a completed setup and the admin the script signs in as.
      - name: Seed the database
        run: npx tsx -e "import('./e2e/global-setup.ts').then((m) => m.default())"

      - name: Build the app
        run: npm run build:e2e

      - name: Start the production server
        env:
          NODE_ENV: production
        run: |
          nohup npx next start -p 3100 > server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3100/; then exit 0; fi
            sleep 2
          done
          cat server.log
          exit 1

      - name: Render the gallery
        env:
          COPY: ${{ inputs.copy }}
        run: |
          if [ "$COPY" = "default" ]; then
            npm run rewind:gallery -- --base-url=http://localhost:3100
          else
            npm run rewind:gallery -- --base-url=http://localhost:3100 "--copy=$COPY"
          fi

      - name: Upload the gallery
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rewind-gallery
          path: |
            rewind-cache/gallery/
            server.log
          retention-days: 14

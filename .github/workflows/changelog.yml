# The changelog check (P11.25). A pull request that touches
# prisma/migrations/**, lib/env.ts, docker/entrypoint.sh, Dockerfile or
# deploy/**, or carries the breaking label, must add a line under
# "## [Unreleased]" in CHANGELOG.md. The no-changelog label skips it. The
# rules are in scripts/release/changelog.mjs; docs/releasing.md has the flow.
#
# Labels are read from the API at run time, not from the event payload, so a
# re-run after a label change judges the pull request as it is now. The token
# is read-only and the job holds no secrets.
name: Changelog

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The merge commit and its two parents: HEAD^1 is the base branch.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          node scripts/check-changelog.mjs --labels "${labels}"

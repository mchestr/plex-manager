# Regenerates the Playwright visual baselines (e2e/visual/__screenshots__) on a
# branch and commits them there. Run it by hand from the Actions tab after a
# styling change; e2e/visual/README.md explains when and how.
name: Visual Baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch of this repository to update (never main)
        required: true
        type: string
      suite:
        description: Which screenshots to regenerate
        required: true
        default: all
        type: choice
        options:
          - all
          - app
          - rewind
          - light

permissions:
  contents: write
  # Only for the fallback dispatch of build.yml below.
  actions: write

concurrency:
  group: visual-baselines-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  update:
    name: Update visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The image the visual specs are compared in. Keep the tag equal to the
    # exact @playwright/test version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plex_manager_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Inside the job container the services are reached by name.
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/plex_manager_test?schema=public"
      E2E_DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/plex_manager_test?schema=public"
      REDIS_URL: "redis://redis:6379/0"
      NEXT_PUBLIC_APP_URL: "http://localhost:3100"
      NEXTAUTH_URL: "http://localhost:3100"
      PLEX_CLIENT_IDENTIFIER: "00000000-0000-0000-0000-000000000000"
      E2E_TEST_MODE: "true"
      SKIP_CONNECTION_TESTS: "true"
      E2E_SERVER: prod
      HAS_VISUAL_PAT: ${{ secrets.VISUAL_BASELINES_TOKEN != '' }}

    steps:
      - name: Refuse main and branch names that are not plain
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          case "$BRANCH" in
            main|refs/*|*..*|-*|"") echo "::error::Pick a feature branch of this repository, not '$BRANCH'."; exit 1 ;;
          esac

      # A GitHub App token (preferred) or a fine-grained PAT, so that the push
      # below starts the pull request's checks on the new head SHA. A push made
      # with GITHUB_TOKEN starts no workflow.
      - name: Mint a GitHub App token
        id: app-token
        if: vars.VISUAL_BASELINES_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.VISUAL_BASELINES_APP_ID }}
          private-key: ${{ secrets.VISUAL_BASELINES_APP_PRIVATE_KEY }}

      - name: Checkout the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Branches of this repository only: a fork's branch is not reachable
          # by name here.
          repository: ${{ github.repository }}
          ref: ${{ inputs.branch }}
          token: ${{ steps.app-token.outputs.token || secrets.VISUAL_BASELINES_TOKEN || github.token }}

      # A fresh secret per run: the production server this job starts refuses
      # the old fixed CI string (lib/env.ts), and the minted session cookies
      # (e2e/fixtures/session.ts) are signed with it.
      - name: Generate NEXTAUTH_SECRET
        run: |
          secret="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64'))")"
          echo "::add-mask::$secret"
          echo "NEXTAUTH_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:deploy

      # The app's screens (P1.6) and Rewind's story pages on chromium and
      # webkit (P5.4). The image ships both browsers.
      - name: Regenerate the baselines
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          app="--project=visual-desktop --project=visual-mobile --project=visual-setup-desktop --project=visual-setup-mobile"
          rewind="--project=rewind-visual-phone-chromium --project=rewind-visual-phone-webkit --project=rewind-visual-desktop-chromium --project=rewind-visual-desktop-webkit"
          # The light theme (P10.10); its Rewind project compares with the dark Rewind baselines instead.
          light="--project=visual-light-desktop --project=visual-light-mobile"
          case "$SUITE" in
            app) projects="$app" ;;
            rewind) projects="$rewind" ;;
            light) projects="$light" ;;
            *) projects="$app $rewind" ;;
          esac
          # shellcheck disable=SC2086 # one word per --project flag
          npx playwright test $projects --update-snapshots=all

      - name: Upload the report and diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Commit and push the baselines
        id: push
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged; nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "test(visual): update visual baselines"
          git push origin "HEAD:$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Fallback when neither token is configured: GITHUB_TOKEN may dispatch
      # build.yml, whose jobs then report under the same names on the new SHA.
      # (The Playwright image has no gh CLI, so this calls the REST API.)
      - name: Start the checks on the new commit
        if: steps.push.outputs.pushed == 'true' && steps.app-token.outputs.token == '' && env.HAS_VISUAL_PAT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          # The single quotes hold JavaScript, which expands its own variables.
          # shellcheck disable=SC2016
          node -e '
            const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches`;
            fetch(url, {
              method: "POST",
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" },
              body: JSON.stringify({ ref: process.env.BRANCH }),
            }).then(async (res) => {
              if (!res.ok) { console.error(res.status, await res.text()); process.exit(1); }
              console.log("Dispatched build.yml on", process.env.BRANCH);
            });
          '

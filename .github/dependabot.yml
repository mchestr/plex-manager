version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Packages that must move together arrive in one pull request.
    groups:
      next-react:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
          - "react"
          - "react-dom"
          - "@types/react*"
      next-auth:
        patterns:
          - "next-auth"
      motion:
        patterns:
          - "motion"
      # Bump the mcr.microsoft.com/playwright:v<version>-noble tags in
      # .github/workflows/build.yml and visual-baselines.yml in the same pull
      # request, then regenerate the visual baselines.
      playwright:
        patterns:
          - "@playwright/test"
      # Every security update in one pull request (Dependabot security
      # updates must be on in the repository settings).
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Semver-major TypeScript and ESLint wait for P11.23.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # bullmq pins its own ioredis; a second copy breaks the typecheck, so
      # ioredis moves only when bullmq's pin does.
      - dependency-name: "ioredis"
        update-types: ["version-update:semver-major"]

  # Enable version updates for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Enable version updates for GitHub Actions (SHA pins included), in the
  # workflows and in the composite actions under .github/actions/.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
